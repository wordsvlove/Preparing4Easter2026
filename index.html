        document.addEventListener('DOMContentLoaded', () => {
            renderOutline();
            loadTodayDevotional();
            
            // 預先載入語音庫，確保可以成功切換聲音
            if (window.speechSynthesis) {
                window.speechSynthesis.getVoices();
                window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
            }
        });

        let currentDevotionalKey = null;
        let isAudioPlaying = false;
        let currentUtterance = null;

        // 取得香港時間的 YYYY-MM-DD
        function getHKDateString() {
            const options = { 
                timeZone: 'Asia/Hong_Kong', 
                year: 'numeric', 
                month: '2-digit', 
                day: '2-digit' 
            };
            const formatter = new Intl.DateTimeFormat('zh-TW', options);
            const parts = formatter.formatToParts(new Date());
            
            const year = parts.find(p => p.type === 'year').value;
            const month = parts.find(p => p.type === 'month').value;
            const day = parts.find(p => p.type === 'day').value;
            
            return `${year}-${month}-${day}`;
        }

        // 載入當天靈修
        function loadTodayDevotional(specificDate = null) {
            // 切換日期時自動停止語音與音樂
            stopAudio();

            let targetDate = specificDate || getHKDateString();

            // 判斷是否在活動期間內
            const startDate = "2026-02-28";
            const endDate = "2026-04-30";

            if (!specificDate && (targetDate < startDate || targetDate > endDate)) {
                targetDate = "2026-02-28";
            }

            const data = devotionals[targetDate];

            if (data) {
                currentDevotionalKey = targetDate;
                renderDevotional(data);
                if(specificDate) {
                    switchTab('today');
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            }
        }

        function renderDevotional(data) {
            document.getElementById('display-date').textContent = data.dateStr;
            document.getElementById('dev-title').textContent = data.title;
            document.getElementById('dev-verse').textContent = data.verse;
            document.getElementById('dev-theology').textContent = data.theology;
            document.getElementById('dev-counseling').textContent = data.counseling;
            document.getElementById('dev-action').textContent = data.action;
            document.getElementById('dev-prayer').textContent = data.prayer;

            const sections = document.querySelectorAll('#content-today section');
            sections.forEach(sec => sec.classList.remove('hidden'));
        }

        // 渲染主題大綱
        function renderOutline() {
            const container = document.getElementById('outline-container');
            let html = '';

            outlineData.forEach(week => {
                html += `
                    <div class="mb-6">
                        <h3 class="text-lg font-bold text-[#8B5A2B] mb-3 border-b border-[#EBE3D5] pb-2">${week.week}</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                `;

                week.days.forEach(day => {
                    html += `
                        <div onclick="loadTodayDevotional('${day.key}')" class="flex items-center p-3 bg-white border border-[#EBE3D5] rounded-lg cursor-pointer hover:bg-[#FDFBF7] hover:shadow-sm transition-all group">
                            <div class="w-16 flex-shrink-0 text-sm font-bold text-[#D4A373] group-hover:text-[#8B5A2B]">${day.date}</div>
                            <div class="text-sm text-gray-700 font-medium truncate">${day.title}</div>
                            <div class="ml-auto text-xs text-green-600 font-bold bg-green-50 px-2 py-0.5 rounded">可閱讀</div>
                        </div>
                    `;
                });

                html += `
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function switchTab(tab) {
            // 切換分頁時自動停止語音與音樂
            stopAudio();

            const tabToday = document.getElementById('tab-today');
            const tabOutline = document.getElementById('tab-outline');
            const contentToday = document.getElementById('content-today');
            const contentOutline = document.getElementById('content-outline');

            if (tab === 'today') {
                tabToday.className = 'px-6 py-3 text-lg transition-colors duration-200 tab-active focus:outline-none';
                tabOutline.className = 'px-6 py-3 text-lg transition-colors duration-200 tab-inactive focus:outline-none';
                contentToday.classList.remove('hidden-content');
                contentOutline.classList.add('hidden-content');
            } else {
                tabOutline.className = 'px-6 py-3 text-lg transition-colors duration-200 tab-active focus:outline-none';
                tabToday.className = 'px-6 py-3 text-lg transition-colors duration-200 tab-inactive focus:outline-none';
                contentOutline.classList.remove('hidden-content');
                contentToday.classList.add('hidden-content');
            }
        }

        // 語音播放功能
        function toggleAudio() {
            const synth = window.speechSynthesis;

            if (isAudioPlaying || synth.speaking) {
                stopAudio();
                return;
            }

            const data = devotionals[currentDevotionalKey];
            if (!data) return;

            // 移除金句中的聖經章節來源
            const verseToSpeak = data.verse.split('——')[0].trim();

            // 準備要朗讀的段落。使用多個全形句號創造約 1.5 秒的自然停頓，避開手機系統阻擋分段播放
            const pauseStr = "。。。。。。";
            const textToSpeak = [
                data.title,
                verseToSpeak,
                data.theology,
                data.counseling,
                data.action,
                data.prayer
            ].join(pauseStr);

            // 確保語音引擎沒有卡在背景
            synth.resume();
            synth.cancel();

            currentUtterance = new SpeechSynthesisUtterance(textToSpeak);
            currentUtterance.lang = 'zh-HK';
            currentUtterance.rate = 0.82;  // 保持慢速
            currentUtterance.pitch = 1.0;  // 恢復正常音調避免女聲變男聲

            // 尋找廣東話女聲
            const voices = synth.getVoices();
            let targetVoices = voices.filter(v => v.lang.includes('zh-HK') || v.lang.toLowerCase().includes('yue'));
            
            const femaleNames = ['sin-ji', 'hiumaan', 'google', 'ting-ting', 'yating', 'hanhan', 'xiaoxiao', 'female'];
            
            let preferredVoice = targetVoices.find(v => {
                const name = v.name.toLowerCase();
                return femaleNames.some(f => name.includes(f));
            });

            // 如果找不到特定女聲，選第一個廣東話聲音
            if (!preferredVoice && targetVoices.length > 0) {
                preferredVoice = targetVoices[0];
            }

            // 容錯機制：如果連廣東話都沒有，找其他的中文女聲，避免完全冇聲
            if (!preferredVoice) {
                let zhVoices = voices.filter(v => v.lang.includes('zh'));
                preferredVoice = zhVoices.find(v => {
                    const name = v.name.toLowerCase();
                    return femaleNames.some(f => name.includes(f));
                }) || zhVoices[0];
            }

            // 設定最終選定的聲音
            if (preferredVoice) {
                currentUtterance.voice = preferredVoice;
                currentUtterance.lang = preferredVoice.lang;
            }

            currentUtterance.onend = () => { stopAudio(); };
            currentUtterance.onerror = (e) => { 
                console.log("語音播放發生錯誤:", e);
                stopAudio(); 
            };

            // 播放背景音樂 (As the Deer 風格的純音樂)
            const bgm = document.getElementById('bgm');
            if (bgm) {
                bgm.volume = 0.10;
                bgm.play().catch(e => console.log("音訊自動播放被阻擋：", e));
            }
            
            synth.speak(currentUtterance);
            setAudioUIPlaying();
        }

        // 停止所有語音與音樂
        function stopAudio() {
            isAudioPlaying = false;
            if (window.speechSynthesis && window.speechSynthesis.speaking) {
                window.speechSynthesis.cancel();
            }
            const bgm = document.getElementById('bgm');
            if (bgm) {
                bgm.pause();
                bgm.currentTime = 0;
            }
            resetAudioUI();
        }

        function resetAudioUI() {
            isAudioPlaying = false;
            const playIcon = document.getElementById('play-icon');
            const pauseIcon = document.getElementById('pause-icon');
            const audioText = document.getElementById('audio-text');
            
            if(playIcon) playIcon.classList.remove('hidden');
            if(pauseIcon) pauseIcon.classList.add('hidden');
            if(audioText) audioText.textContent = "聆聽靈修 (沉思版)";
        }

        function setAudioUIPlaying() {
            isAudioPlaying = true;
            document.getElementById('play-icon').classList.add('hidden');
            document.getElementById('pause-icon').classList.remove('hidden');
            document.getElementById('audio-text').textContent = "停止聆聽";
        }
    </script>
